name: Actualizar encuestas

on:
  schedule:
    - cron: "17 6,13,20 * * *"  # tres veces al día (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/actualizar_datos.py --solo-encuestas
      - run: python scripts/foto_readme.py
      - name: Commit si hay cambios
        run: |
          if git diff --quiet -- data README.md; then
            echo "Sin encuestas nuevas"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md
          git commit -m "data: refresh polls ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          git push
